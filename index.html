<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>EstudoAdapt - Gerenciador de Alta Performance</title>
    <!-- Tailwind CSS Oficial via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }

        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        @keyframes spin-fast { to { transform: rotate(360deg); } }
        .animate-spin-fast { animation: spin-fast 0.8s linear infinite; }
        
        /* Dark Mode Overrides Inteligentes */
        html.dark body { background-color: #0f172a !important; color: #f8fafc !important; }

        html.dark .bg-slate-100 { background-color: #334155 !important; }
        html.dark .bg-slate-200 { background-color: #475569 !important; }
        html.dark .bg-slate-900 { background-color: #020617 !important; border-color: #1e293b !important; }
        html.dark .text-slate-900, html.dark .text-slate-800 { color: #ffffff !important; } /* Títulos mais claros e visíveis */
        html.dark .text-slate-700 { color: #f1f5f9 !important; }
        html.dark .text-slate-600 { color: #cbd5e1 !important; }
        html.dark .text-slate-500 { color: #94a3b8 !important; }
        html.dark .text-slate-400 { color: #64748b !important; }
        html.dark .border-slate-100, html.dark .border-slate-200 { border-color: #334155 !important; }
        html.dark .border-slate-300 { border-color: #475569 !important; }
        html.dark input, html.dark select, html.dark textarea { background-color: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important; }
        html.dark .shadow-xs, html.dark .shadow-md, html.dark .shadow-lg, html.dark .shadow-xl { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3) !important; }

        html.dark .bg-rose-50, html.dark .bg-rose-100 { background-color: rgba(244, 63, 94, 0.15) !important; border-color: rgba(244, 63, 94, 0.3) !important; }
        html.dark .bg-amber-50, html.dark .bg-amber-100 { background-color: rgba(245, 158, 11, 0.15) !important; border-color: rgba(245, 158, 11, 0.3) !important; }
        html.dark .bg-purple-50, html.dark .bg-purple-100 { background-color: rgba(168, 85, 247, 0.15) !important; border-color: rgba(168, 85, 247, 0.3) !important; }

<body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-600 selection:text-white min-h-screen flex flex-col">

    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-3"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let firebaseApp, db, auth;
        let authUser = null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'estudoadapt-app';

        try {
            if (typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                firebaseApp = initializeApp(firebaseConfig);
                db = getFirestore(firebaseApp);
                auth = getAuth(firebaseApp);

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.error("Erro de Autenticação na Nuvem:", e);
                    }
                };
                initAuth();

                onAuthStateChanged(auth, (user) => {
                    authUser = user;
                    const btnStatus = document.getElementById('cloud-status-indicator');
                    if (btnStatus) {
                        if (user) {
                            btnStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Nuvem Conectada`;
                            btnStatus.classList.replace('text-slate-400', 'text-emerald-600');
                            
                            const modalStatus = document.getElementById('cloud-modal-status');
                            if(modalStatus) {
                                modalStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Conectado via Conta Segura`;
                                modalStatus.classList.replace('text-rose-500', 'text-emerald-600');
                            }
                        } else {
                            btnStatus.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-400"></span> Nuvem Offline`;
                        }
                    }
                });
            }
        } catch (e) {
            console.warn("Nuvem indisponível no ambiente atual.", e);

        const icon = (name, extraClass = "") => `<span class="inline-flex items-center justify-center shrink-0 ${extraClass}">${ICONS[name] || ''}</span>`;

        async function callGeminiApi({ prompt, systemInstruction = "", generationConfig = null }) {
            const apiKey = state.apiKey || "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            if (generationConfig) payload.generationConfig = generationConfig;

            const maxRetries = 4;
            let delayMs = 1000;

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errBody = await response.json().catch(() => ({}));
                        throw new Error(errBody?.error?.message || `HTTP ${response.status}`);
                    }

                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("A IA retornou uma resposta sem texto.");
                    return text;
                } catch (err) {
                    if (attempt === maxRetries) throw err;
                    await new Promise(res => setTimeout(res, delayMs));
                    delayMs *= 2;
                }
            }
        }

        const COMMON_BANCAS = ['Cebraspe', 'FGV', 'FCC', 'Vunesp', 'IBFC', 'Quadrix', 'AOCP', 'Cesgranrio', 'Outra'];
        const ALL_MODALITIES = ['Teoria', 'Questões', 'Revisão', 'Videoaula', 'Leitura de Lei', 'Resumo', 'Discursiva'];

        const SUBJECT_ACCENT_COLORS = [
            '#6366f1', '#8b5cf6', '#10b981', '#06b6d4', '#f97316', '#ec4899', '#14b8a6', '#eab308'
        ];

        function addDays(baseDateStr, days) {
            const d = new Date(baseDateStr + 'T12:00:00');
            d.setDate(d.getDate() + days);
            return d.toISOString().split('T')[0];
        }

        function createDefaultReviewConfig(baseDateStr) {
            const base = baseDateStr || new Date().toISOString().split('T')[0];
            return {
                enabled: false,
                mode: 'espacada',
                spacedPreset: '1-7-30',
                spacedRepeatAfterLast: false,
                customDates: [addDays(base, 1)],
                recurringFreq: 'semanal',
                recurringEvery: 1,
                recurringUnit: 'semana(s)',
                recurringStartDate: base,
                recurringIndefinite: true
            };

            if (savedS) state.syllabus = JSON.parse(savedS);
            else state.syllabus = INITIAL_SYLLABUS;

            if (savedK) state.apiKey = savedK;
            if (savedPreps) {

                state.preparacoes = parsedPreps.map(p => ({
                    fase: p.fase || (p.dataProva ? 'pos_edital' : 'pre_edital'),

                    ...p
                }));
            }
            if (savedActivePrep) state.activePrepId = savedActivePrep;
            if (savedSess) state.sessionsHistory = JSON.parse(savedSess);
            if (savedSim) {
                const parsed = JSON.parse(savedSim);
                state.simulados = parsed.map(s => {
                    const qTot = s.questoes || 120;
                    const c = s.acertos || 0;
                    const err = s.erros !== undefined ? s.erros : Math.max(0, qTot - c);
                    const br = s.emBranco !== undefined ? s.emBranco : 0;
                    return {
                        id: s.id || 'sim-' + Date.now(),
                        prepId: s.prepId || state.activePrepId,
                        data: s.data || todayInitial,
                        titulo: s.titulo || 'Simulado',
                        banca: s.banca || 'Cebraspe',
                        tipoProva: s.tipoProva || 'certo_errado',
                        questoes: qTot,
                        acertos: c,
                        erros: err,
                        emBranco: br,
                        notas: s.notas || ''
                    };
                });
            } else {
                state.simulados = INITIAL_SIMULADOS;
            }
            if (savedRev) state.scheduledReviews = JSON.parse(savedRev);
            if (savedRConfigs) {

                if (parsed.timer) state.reviewConfigs.timer = { ...state.reviewConfigs.timer, ...parsed.timer };

            if (savedTheme) {

                else document.documentElement.classList.remove('dark');

            state.syllabus = INITIAL_SYLLABUS;
            state.simulados = INITIAL_SIMULADOS;
        }

        const persist = () => {
            try {
                localStorage.setItem('est_v18_s', JSON.stringify(state.syllabus));

                localStorage.setItem('est_v18_k', state.apiKey);
                localStorage.setItem('est_v18_preps', JSON.stringify(state.preparacoes));
                localStorage.setItem('est_v18_active_prep', state.activePrepId);
                localStorage.setItem('est_v18_sess', JSON.stringify(state.sessionsHistory));
                localStorage.setItem('est_v18_sim', JSON.stringify(state.simulados));
                localStorage.setItem('est_v18_rev', JSON.stringify(state.scheduledReviews));
                localStorage.setItem('est_v18_rev_cfgs', JSON.stringify(state.reviewConfigs));
                localStorage.setItem('est_v18_exp_subj', JSON.stringify(state.expandedSubjectIds));
                localStorage.setItem('est_v18_cloud_sync', state.cloudSyncEnabled);
                localStorage.setItem('est_v18_theme', state.theme);

                // Auto-Sync Background
                if (state.cloudSyncEnabled && authUser && db) {
                    saveToCloudBackground();
                }
            } catch(e) {}
        };

        async function saveToCloudBackground() {
            try {
                const dataToExport = {
                    syllabus: state.syllabus,
                    cycles: state.cycles,
                    preparacoes: state.preparacoes,
                    activePrepId: state.activePrepId,
                    sessionsHistory: state.sessionsHistory,
                    simulados: state.simulados,
                    scheduledReviews: state.scheduledReviews,
                    reviewConfigs: state.reviewConfigs,
                    version: '18.0',
                    lastSync: new Date().toISOString()
                };
                const docRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'appData', 'state');
                await setDoc(docRef, dataToExport);
            } catch (err) {
                console.warn("Erro no Auto-Sync da Nuvem:", err);
            }
        }

        function getActivePreparation() {
            return state.preparacoes.find(p => p.id === state.activePrepId) || state.preparacoes[0] || INITIAL_PREPARACOES[0];
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'error' ? 'bg-rose-600' : type === 'info' ? 'bg-amber-600' : 'bg-indigo-600';
            toast.className = `pointer-events-auto flex items-center justify-between p-3.5 rounded-xl shadow-xl text-white text-xs font-bold transform transition-all duration-300 translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `<div class="flex items-center gap-2">${icon(type === 'error' ? 'trash' : type === 'info' ? 'settings' : 'check')}<span>${message}</span></div>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        function getAllTopics() {
            return state.syllabus.flatMap(s => (s.topics || []).map(t => ({ ...t, subjectName: s.subject, subjectId: s.id })));
        }

        function getTopicStartedDate(topic) {
            if (topic.startedAt) return topic.startedAt;
            const matchingSessions = state.sessionsHistory.filter(s => s.topicId === topic.id);
            if (matchingSessions.length > 0) {
                const dates = matchingSessions.map(s => s.date).filter(Boolean).sort();
                if (dates.length > 0) return dates[0];
            }
            return null;
        }

        function formatDuration(minutes) {
            const h = Math.floor(minutes / 60);
            const m = Math.round(minutes % 60);
            if (h === 0) return `${m}min`;
            if (m === 0) return `${h}h`;
            return `${h}h ${m}m`;
        }

        function formatTimer(s) {
            const h = Math.floor(s / 3600).toString().padStart(2, '0');
            const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
            const sec = (s % 60).toString().padStart(2, '0');
            return `${h}:${m}:${sec}`;
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) return '';
            const [y, m, d] = dateStr.split('-');
            return `${d}/${m}/${y}`;
        }

        // Sessões filtradas por escopo (Exclusivamente de exercícios reais - NÃO misturam simulados)
        function getFilteredSessions(scope = state.statsScope, prepId = state.activePrepId, faseFilter = state.faseSubFilter) {
            const currentPrep = state.preparacoes.find(p => p.id === prepId) || getActivePreparation();
            if (scope === 'atual') {
                return state.sessionsHistory.filter(s => {
                    const matchesPrep = (s.prepId === prepId);
                    const afterStart = currentPrep.dataInicio ? (s.date >= currentPrep.dataInicio) : true;
                    if (!matchesPrep || !afterStart) return false;

                    if (faseFilter === 'pre' && currentPrep.dataPublicacaoEdital) {
                        return s.date < currentPrep.dataPublicacaoEdital;
                    }
                    if (faseFilter === 'pos' && currentPrep.dataPublicacaoEdital) {
                        return s.date >= currentPrep.dataPublicacaoEdital;
                    }
                    return true;
                });
            }
            return state.sessionsHistory;
        }

        // Simulados filtrados por preparação (Restritos e isolados das questões reais)
        function getFilteredSimulados(prepId = state.activePrepId) {
            return state.simulados.filter(sim => sim.prepId === prepId);
        }

        function calculateDetailedBancaStats(sessionsList) {
            const bancaMap = {};

            sessionsList.forEach(s => {
                const b = s.banca || 'Geral';
                if (!bancaMap[b]) {
                    bancaMap[b] = {
                        name: b,
                        questions: 0,
                        correct: 0,
                        sessionsCount: 0,
                        durationMinutes: 0,
                        subjectsMap: {},
                        topicsMap: {}
                    };
                }
                const bObj = bancaMap[b];
                const q = s.questions || 0;
                const c = s.correct || 0;
                bObj.questions += q;
                bObj.correct += c;
                bObj.sessionsCount++;
                bObj.durationMinutes += (s.durationMinutes || 0);

                if (s.topicId) {
                    const topInfo = getAllTopics().find(t => t.id === s.topicId);
                    let subName = topInfo ? topInfo.subjectName : 'Matéria Geral';
                    let topName = topInfo ? topInfo.name : (s.topicName || 'Tópico Geral');

                    // Recupera o nome da matéria pelo snapshot da sessão caso tenha sido excluída do edital
                    if (!topInfo && s.topicName && s.topicName.includes(':')) {
                        subName = s.topicName.split(':')[0].trim();
                        topName = s.topicName.substring(s.topicName.indexOf(':') + 1).trim();
                    }

                    if (!bObj.subjectsMap[subName]) bObj.subjectsMap[subName] = { questions: 0, correct: 0 };
                    bObj.subjectsMap[subName].questions += q;
                    bObj.subjectsMap[subName].correct += c;

                    if (!bObj.topicsMap[s.topicId]) {
                        bObj.topicsMap[s.topicId] = {
                            id: s.topicId,
                            subjectName: subName,
                            name: topName,
                            questions: 0,
                            correct: 0,
                            lastDate: s.date,
                            status: topInfo ? topInfo.status : 'em andamento'
                        };
                    }
                    bObj.topicsMap[s.topicId].questions += q;
                    bObj.topicsMap[s.topicId].correct += c;
                    if (s.date > bObj.topicsMap[s.topicId].lastDate) {
                        bObj.topicsMap[s.topicId].lastDate = s.date;
                    }
                }
            });

            return Object.values(bancaMap).map(b => {
                const acc = b.questions > 0 ? (b.correct / b.questions) * 100 : 0;
                const topicsList = Object.values(b.topicsMap).map(t => ({
                    ...t,
                    errors: Math.max(0, t.questions - t.correct),
                    accuracy: t.questions > 0 ? (t.correct / t.questions) * 100 : 0
                }));
                topicsList.sort((x, y) => y.questions - x.questions);

                const subjectsList = Object.entries(b.subjectsMap).map(([sub, data]) => ({
                    subject: sub,
                    questions: data.questions,
                    correct: data.correct,
                    accuracy: data.questions > 0 ? (data.correct / data.questions) * 100 : 0
                }));
                subjectsList.sort((x, y) => y.questions - x.questions);

                return {
                    ...b,
                    accuracy: acc,
                    topicsList,
                    subjectsList
                };
            });
        }

        function computePreparationMetrics(prep) {
            const sessions = state.sessionsHistory.filter(s => s.prepId === prep.id && (!prep.dataInicio || s.date >= prep.dataInicio));
            const simulados = state.simulados.filter(sim => sim.prepId === prep.id && (!prep.dataInicio || sim.data >= prep.dataInicio));

            const totalMinutes = sessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);
            const totalHours = (totalMinutes / 60).toFixed(1);

            // Apenas questões reais de sessões de estudo
            const totalQ = sessions.reduce((acc, s) => acc + (s.questions || 0), 0);
            const totalC = sessions.reduce((acc, s) => acc + (s.correct || 0), 0);
            const accuracy = totalQ > 0 ? ((totalC / totalQ) * 100).toFixed(1) : '0.0';

            const studyDates = new Set(sessions.map(s => s.date));
            const uniqueStudyDays = studyDates.size;

            let totalCalendarDays = 1;
            if (prep.dataInicio) {
                const start = new Date(prep.dataInicio + 'T00:00:00');
                const end = new Date();
                const diffTime = Math.max(0, end - start);
                totalCalendarDays = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
            }

            const constanciaPercent = Math.min(100, Math.round((uniqueStudyDays / totalCalendarDays) * 100));
            const avgDailyHours = (totalMinutes / (uniqueStudyDays || 1) / 60).toFixed(1);

            let preEditalStats = null;
            let posEditalStats = null;
            if (prep.dataPublicacaoEdital) {
                const preSessions = sessions.filter(s => s.date < prep.dataPublicacaoEdital);
                const posSessions = sessions.filter(s => s.date >= prep.dataPublicacaoEdital);

                const preM = preSessions.reduce((a, s) => a + (s.durationMinutes || 0), 0);
                const preQ = preSessions.reduce((a, s) => a + (s.questions || 0), 0);
                const preC = preSessions.reduce((a, s) => a + (s.correct || 0), 0);

                const posM = posSessions.reduce((a, s) => a + (s.durationMinutes || 0), 0);
                const posQ = posSessions.reduce((a, s) => a + (s.questions || 0), 0);
                const posC = posSessions.reduce((a, s) => a + (s.correct || 0), 0);

                preEditalStats = {
                    hours: (preM / 60).toFixed(1),
                    questions: preQ,
                    accuracy: preQ > 0 ? ((preC / preQ) * 100).toFixed(1) : '0.0'
                };
                posEditalStats = {
                    hours: (posM / 60).toFixed(1),
                    questions: posQ,
                    accuracy: posQ > 0 ? ((posC / posQ) * 100).toFixed(1) : '0.0'
                };
            }

            const subjectStatsMap = {};
            sessions.forEach(s => {
                if (s.topicId) {
                    const t = getAllTopics().find(top => top.id === s.topicId);
                    let subName = t ? t.subjectName : 'Geral';
                    // Recupera matéria arquivada/deletada
                    if (!t && s.topicName && s.topicName.includes(':')) {
                        subName = s.topicName.split(':')[0].trim();
                    }
                    if (!subjectStatsMap[subName]) subjectStatsMap[subName] = { minutes: 0, q: 0, c: 0 };
                    subjectStatsMap[subName].minutes += (s.durationMinutes || 0);
                    subjectStatsMap[subName].q += (s.questions || 0);
                    subjectStatsMap[subName].c += (s.correct || 0);
                }
            });
            const subjectsList = Object.entries(subjectStatsMap).map(([subject, data]) => ({
                subject,
                hours: (data.minutes / 60).toFixed(1),
                questions: data.q,
                accuracy: data.q > 0 ? ((data.c / data.q) * 100).toFixed(1) : '0.0'
            }));
            subjectsList.sort((a, b) => parseFloat(b.hours) - parseFloat(a.hours));

            return {
                prep,
                totalMinutes,
                totalHours,
                totalQ,
                totalC,
                accuracy,
                uniqueStudyDays,
                totalCalendarDays,
                constanciaPercent,
                avgDailyHours,
                simuladosCount: simulados.length,
                preEditalStats,
                posEditalStats,
                subjectsList
            };
        }

        function calculateReviewDates(cfg, baseDateStr) {
            const base = baseDateStr || new Date().toISOString().split('T')[0];
            const dates = [];

            if (cfg.mode === 'espacada') {
                const offsets = cfg.spacedPreset === '1-7-14-30' ? [1, 7, 14, 30] :
                                cfg.spacedPreset === '1-3-7-15-30' ? [1, 3, 7, 15, 30] : [1, 7, 30];
                offsets.forEach(d => dates.push(addDays(base, d)));
                if (cfg.spacedRepeatAfterLast) {
                    const lastOffset = offsets[offsets.length - 1];
                    for (let rep = 1; rep <= 4; rep++) {
                        dates.push(addDays(base, lastOffset + (rep * 30)));
                    }
                }
            } else if (cfg.mode === 'datas') {
                (cfg.customDates || []).forEach(d => { if (d) dates.push(d); });
            } else if (cfg.mode === 'recorrente') {
                const start = cfg.recurringStartDate || base;
                let stepDays = 7;
                if (cfg.recurringFreq === 'quinzenal') stepDays = 15;
                if (cfg.recurringFreq === 'mensal') stepDays = 30;
                const multiplier = parseInt(cfg.recurringEvery) || 1;
                stepDays = stepDays * multiplier;

                for (let i = 0; i < 6; i++) {
                    dates.push(addDays(start, i * stepDays));
                }
            }
            return [...new Set(dates)].sort();
        }

                                            <p class="text-[10px] text-slate-400 font-mono">${cfg.spacedPreset.split('-').join(', ')} vira ${cfg.spacedPreset.split('-').join(', ')}, 60, 90... até encerrar.</p>

        function renderPreparationHeader(currentPrep) {

            if (isPos && currentPrep.dataProva) {

                                <span class="text-[10px] font-bold text-slate-300 bg-white/10 px-2.5 py-1 rounded-full">

                            </div>

                            <h2 class="text-2xl md:text-3xl font-black tracking-tight">${currentPrep.nome}</h2>
                            <p class="text-indigo-200 text-xs md:text-sm font-medium">
                                ${currentPrep.cargo}
                                ${currentPrep.dataPublicacaoEdital ? ` • Edital publicado em: <span class="text-white font-bold">${formatDisplayDate(currentPrep.dataPublicacaoEdital)}</span>` : ''}
                            </p>

                        <div class="flex flex-wrap sm:flex-nowrap items-center gap-3 self-stretch sm:self-auto">
                            ${currentPrep.fase === 'pos_edital' ? `
                                <div class="bg-white/10 backdrop-blur-md px-5 py-3 rounded-2xl border border-white/10 text-center flex-1 sm:flex-initial">
                                    <p class="text-[10px] font-bold text-indigo-200 uppercase tracking-wider">Contagem Regressiva</p>
                                    <p class="text-2xl md:text-3xl font-black text-amber-300 font-mono tracking-tight">
                                        ${diasRestantes !== null ? `D - ${diasRestantes}` : '--'}
                                    </p>
                                    <p class="text-[10px] text-indigo-200">${currentPrep.dataProva ? `Prova: ${formatDisplayDate(currentPrep.dataProva)}` : 'Data Indefinida'}</p>
                                </div>
                            ` : `
                                <div class="bg-amber-500/10 backdrop-blur-md px-5 py-3 rounded-2xl border border-amber-500/20 text-center flex-1 sm:flex-initial">
                                    <p class="text-[10px] font-bold text-amber-300 uppercase tracking-wider">Bagagem Acumulada</p>
                                    <p class="text-2xl md:text-3xl font-black text-amber-300 font-mono tracking-tight">
                                        ${diasBagagem} dias
                                    </p>
                                    <p class="text-[10px] text-slate-300">Data de prova a definir</p>
                                </div>
                            `}

                            <div class="flex flex-col gap-2">
                                <button id="btn-open-switch-prep-modal" class="bg-white/10 hover:bg-white/20 text-white px-3.5 py-2 rounded-xl text-xs font-bold border border-white/10 transition-colors flex items-center justify-center gap-1.5">
                                    ${icon('settings')} Gerenciar / Trocar
                                </button>
                                ${currentPrep.fase === 'pre_edital' ? `
                                    <button id="btn-trigger-virada-modal" class="bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white px-3.5 py-2 rounded-xl text-xs font-extrabold shadow-lg shadow-rose-900/40 transition-all flex items-center justify-center gap-1.5">
                                        ${icon('rocket')} Publicou o Edital!
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-white/10 flex flex-wrap items-center justify-between gap-3 text-xs">
                        <div class="flex items-center gap-2">

                            <div class="flex bg-black/40 p-1 rounded-xl border border-white/10">
                                <button data-set-scope="atual" class="px-3 py-1 rounded-lg font-bold text-xs transition-all ${state.statsScope === 'atual' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">
                                    🎯 Preparação Atual (Desde ${formatDisplayDate(currentPrep.dataInicio) || 'início'})
                                </button>
                                <button data-set-scope="global" class="px-3 py-1 rounded-lg font-bold text-xs transition-all ${state.statsScope === 'global' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}">
                                    🌐 Visão Global (Todo o Histórico)
                                </button>
                            </div>
                        </div>

                        ${currentPrep.dataPublicacaoEdital ? `
                            <div class="flex items-center gap-1.5 bg-black/30 px-2 py-1 rounded-xl border border-white/10">
                                <span class="text-slate-400 text-[10px]">Fase:</span>
                                ${[
                                    { id: 'todas', label: 'Ciclo Todo' },
                                    { id: 'pre', label: 'Pré-Edital' },
                                    { id: 'pos', label: 'Pós-Edital' }
                                ].map(f => `
                                    <button data-set-fase-filter="${f.id}" class="px-2 py-0.5 rounded text-[10px] font-bold ${state.faseSubFilter === f.id ? 'bg-white text-slate-900' : 'text-slate-400 hover:text-white'}">
                                        ${f.label}
                                    </button>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function showBackupModal() {
            const container = document.getElementById('modal-container');
            const dataToExport = {
                syllabus: state.syllabus,
                cycles: state.cycles,
                preparacoes: state.preparacoes,
                activePrepId: state.activePrepId,
                sessionsHistory: state.sessionsHistory,
                simulados: state.simulados,
                scheduledReviews: state.scheduledReviews,
                reviewConfigs: state.reviewConfigs,
                version: '18.0',
                exportedAt: new Date().toISOString()
            };
            const jsonString = JSON.stringify(dataToExport, null, 2);

            // Verifica se o Firebase foi carregado e se a nuvem está disponível
            const isCloudAvailable = (typeof firebaseApp !== 'undefined' && authUser);

            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-xl w-full p-6 md:p-8 shadow-2xl space-y-6 border border-slate-100">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                            <div class="flex items-center gap-2.5">
                                <div class="p-2 bg-indigo-50 text-indigo-600 rounded-xl">${icon('backup')}</div>
                                <div>
                                    <h3 class="text-base font-black text-slate-800">Sincronização & Backup</h3>
                                    <p class="text-xs text-slate-500">Mantenha seus dados seguros e transfira entre aparelhos</p>
                                </div>
                            </div>
                            <button id="modal-close-backup" class="text-slate-400 hover:text-slate-600 p-1">${icon('x')}</button>
                        </div>

                        ${isCloudAvailable ? `
                            <!-- Opção 1: Nuvem Online (Só aparece se o app estiver hospedado) -->
                            <div class="space-y-4 bg-indigo-50/50 p-5 rounded-2xl border border-indigo-100 shadow-inner">
                                <div class="flex items-center justify-between">
                                    <p class="text-xs font-black text-indigo-900 uppercase tracking-wider flex items-center gap-2">
                                        ${icon('rocket')} Nuvem EstudoAdapt
                                    </p>
                                    <div id="cloud-modal-status" class="flex items-center gap-1.5 text-[10px] font-bold text-emerald-600 bg-white px-2.5 py-1 rounded-full shadow-xs">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        Conectado via Conta Segura
                                    </div>
                                </div>
                                
                                <p class="text-xs text-indigo-700 leading-relaxed">
                                    A sincronização online salva seu progresso na nuvem. Os dados são integrados de forma mágica.
                                </p>
                                
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <button id="btn-cloud-upload" class="px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md flex items-center justify-center gap-2 transition-all">
                                        ${icon('chevronUp')} Forçar Upload p/ Nuvem
                                    </button>
                                    <button id="btn-cloud-download" class="px-4 py-3 bg-white text-indigo-700 hover:bg-indigo-50 border border-indigo-200 font-bold text-xs rounded-xl shadow-xs flex items-center justify-center gap-2 transition-all">
                                        ${icon('chevronDown')} Puxar Dados da Nuvem
                                    </button>
                                </div>

                                <div class="flex items-center justify-between p-3 bg-white rounded-xl border border-indigo-100">
                                    <div>
                                        <p class="text-xs font-bold text-slate-800">Sincronização Automática</p>
                                        <p class="text-[10px] text-slate-500">Salva na nuvem silenciosamente após cada estudo</p>
                                    </div>
                                    <input type="checkbox" id="chk-auto-sync" ${state.cloudSyncEnabled ? 'checked' : ''} class="w-5 h-5 rounded text-indigo-600 bg-slate-100 border-slate-300 cursor-pointer"/>
                                </div>
                            </div>
                        ` : `
                            <!-- Alerta de Modo Local (Arquivo Solto) -->
                            <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl flex gap-3 items-start">
                                <div class="text-slate-400 mt-0.5">${icon('shield')}</div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-700">Modo de Arquivo Local (Offline)</h4>
                                    <p class="text-[11px] text-slate-500 mt-1 leading-relaxed">
                                        Como você está acessando o aplicativo diretamente de um arquivo no seu dispositivo, a conexão em nuvem está desativada. Para sincronizar o PC com o iPad, utilize o método de <strong>Copiar e Colar Código</strong> abaixo.
                                    </p>
                                </div>
                            </div>
                        `}

                        <!-- Opção 2: Backup Offline (SEMPRE APARECE) -->
                        <div class="space-y-4 pt-2">
                            <p class="text-xs font-black text-slate-700 uppercase tracking-wider flex items-center gap-2">
                                ${icon('backup')} Backup Manual e Transferência (PC ⇄ iPad)
                            </p>

                            <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200/80">
                                <p class="text-[11px] font-bold text-slate-600 flex items-center gap-1.5">
                                    <span class="bg-slate-200 text-slate-600 px-1.5 rounded">1</span> Levar do aparelho atual para outro
                                </p>
                                <button id="btn-copy-backup-text" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl transition-all shadow-md">
                                    Copiar Código de Backup
                                </button>
                                <button id="btn-download-json" class="w-full py-2.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-bold text-xs rounded-xl transition-all">
                                    Baixar Arquivo .json
                                </button>
                                
                                <p class="text-[11px] font-bold text-slate-600 flex items-center gap-1.5 pt-3 mt-1 border-t border-slate-200">
                                    <span class="bg-slate-200 text-slate-600 px-1.5 rounded">2</span> Trazer dados para este aparelho
                                </p>
                                <div class="flex gap-2">
                                    <input type="text" id="input-restore-text" placeholder="Cole o código gigante aqui..." class="flex-1 p-2.5 text-xs bg-white border border-slate-300 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all" />
                                    <button id="btn-restore-text" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl transition-all shadow-md">
                                        Restaurar
                                    </button>
                                </div>
                                <div class="relative mt-2">
                                    <input type="file" id="input-restore-file" accept=".json" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                    <button class="w-full py-2.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-bold text-xs rounded-xl transition-all pointer-events-none">
                                        Carregar Arquivo .json
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modal-close-backup').onclick = () => { container.innerHTML = ''; };

            // Backup Logic
            const executeRestoreData = (parsedData) => {
                if (parsedData && parsedData.syllabus) {
                    state.syllabus = parsedData.syllabus;
                    if (parsedData.cycles) state.cycles = parsedData.cycles;
                    if (parsedData.preparacoes) state.preparacoes = parsedData.preparacoes;
                    if (parsedData.activePrepId) state.activePrepId = parsedData.activePrepId;
                    if (parsedData.sessionsHistory) state.sessionsHistory = parsedData.sessionsHistory;
                    if (parsedData.simulados) state.simulados = parsedData.simulados;
                    if (parsedData.scheduledReviews) state.scheduledReviews = parsedData.scheduledReviews;
                    if (parsedData.reviewConfigs) state.reviewConfigs = parsedData.reviewConfigs;
                    persist();
                    container.innerHTML = '';
                    showToast("Dados restaurados com sucesso!");
                    render();
                } else {
                    showToast("Formato de backup inválido.", "error");
                }
            };

            document.getElementById('btn-copy-backup-text').onclick = () => {
                navigator.clipboard.writeText(jsonString).then(() => {
                    showToast("Código copiado! Cole no outro aparelho.");
                }).catch(() => {
                    const textArea = document.createElement("textarea");
                    textArea.value = jsonString;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showToast("Código copiado! Cole no outro aparelho.");
                    } catch (err) {
                        showToast("Erro ao copiar o código.", "error");
                    }
                    document.body.removeChild(textArea);
                });
            };

            document.getElementById('btn-download-json').onclick = () => {
                const blob = new Blob([jsonString], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `estudoadapt_backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            document.getElementById('btn-restore-text').onclick = () => {
                const text = document.getElementById('input-restore-text').value.trim();
                if (!text) {
                    showToast("Cole o código primeiro.", "info");
                    return;
                }
                showConfirmModal("Restaurar Backup", "Atenção: Isso substituirá seus dados locais atuais. Continuar?", () => {
                    try {
                        executeRestoreData(JSON.parse(text));
                    } catch (e) {
                        showToast("Código inválido.", "error");
                    }
                });
            };

            const fileInput = document.getElementById('input-restore-file');
            if (fileInput) {
                fileInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    showConfirmModal("Restaurar Arquivo", "Atenção: Isso substituirá seus dados locais atuais. Continuar?", () => {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                executeRestoreData(JSON.parse(event.target.result));
                            } catch (err) {
                                showToast("Arquivo inválido.", "error");
                            }
                        };
                        reader.readAsText(file);
                    });
                };
            }

            // Cloud logic
            const chkAutoSync = document.getElementById('chk-auto-sync');
            if (chkAutoSync) {
                chkAutoSync.onchange = (e) => {
                    state.cloudSyncEnabled = e.target.checked;
                    persist();
                    if (state.cloudSyncEnabled) showToast("Auto-Sync Ativado! Seus estudos estão seguros.");
                };
            }

            const btnCloudUpload = document.getElementById('btn-cloud-upload');
            if (btnCloudUpload) {

        function renderCalendarTab(currentPrep) {
            const today = new Date();
            const year = state.calendarYear;
            const month = state.calendarMonth;
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startDay = firstDay.getDay();

            const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            
            const daysHTML = [];
            for (let i = 0; i < startDay; i++) {
                daysHTML.push(`<div class="p-2 border border-slate-100 bg-slate-50/40 opacity-50"></div>`);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === today.toISOString().split('T')[0];
                const isSelected = dateStr === state.calendarSelectedDay;
                
                const daySessions = state.sessionsHistory.filter(s => s.date === dateStr);
                const hasStudy = daySessions.length > 0;
                
                const pendingRevs = state.scheduledReviews.filter(r => r.dates.includes(dateStr) && !r.completedDates.includes(dateStr));
                const doneRevs = state.scheduledReviews.filter(r => r.dates.includes(dateStr) && r.completedDates.includes(dateStr));
                const hasPendingRev = pendingRevs.length > 0;
                
                daysHTML.push(`
                    <div data-cal-day="${dateStr}" class="min-h-[85px] p-2 border ${isSelected ? 'border-indigo-500 ring-1 ring-indigo-500 z-10' : 'border-slate-100'} ${isToday ? 'bg-indigo-50/30' : 'bg-white'} cursor-pointer hover:bg-slate-50 transition-colors flex flex-col justify-between relative">
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-black ${isToday ? 'text-indigo-600' : 'text-slate-600'} ${hasStudy ? 'bg-emerald-100 text-emerald-900 w-6 h-6 flex items-center justify-center rounded-full shadow-xs' : ''}">${d}</span>

                                        ${selSessions.length === 0 ? `<p class="text-xs text-slate-400 italic p-4 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-center">Nenhum estudo computado neste dia.</p>` : selSessions.map(s => `

        function renderEstatisticasTab(currentPrep) {

            if (state.statsBancaFilter !== 'todas') {

            // Order
            if (state.statsOrder === 'questoes_desc') {
                filteredBancas.sort((a, b) => b.questions - a.questions);
            } else if (state.statsOrder === 'acerto_desc') {
                filteredBancas.sort((a, b) => b.accuracy - a.accuracy);
            } else if (state.statsOrder === 'acerto_asc') {
                filteredBancas.sort((a, b) => a.accuracy - b.accuracy);

            return `
                <div class="space-y-6">

                                                <div>

                                                            <span class="text-xs font-black px-2 py-0.5 rounded-lg ${
                                                                sub.accuracy >= 75 ? 'bg-emerald-100 text-emerald-800' :
                                                                sub.accuracy >= 60 ? 'bg-amber-100 text-amber-800' :
                                                                'bg-rose-100 text-rose-800'
                                                            }">
                                                                ${sub.accuracy.toFixed(0)}%
                                                            </span>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            </div>

                                            <div class="space-y-2">
                                                <div class="flex items-center justify-between">
                                                    <p class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Tópicos e Conteúdos Específicos Praticados</p>

                                                                            ${t.status}

                                                                            ${t.accuracy.toFixed(1)}%
                                                                        </span>
                                                                    </td>
                                                                </tr>
                                                            `).join('')}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>

                                </div>

                                                ${isActive ? `

                                                </div>

        function renderHistoricoTab(currentPrep) {
            const allSessions = getFilteredSessions();
            const f = state.historyFilters;

            // Filtragem avançada
            let filtered = allSessions.filter(s => {
                if (f.subject !== 'todas') {
                    const top = getAllTopics().find(t => t.id === s.topicId);
                    let subName = top ? top.subjectName : '';
                    if (!top && s.topicName && s.topicName.includes(':')) {
                        subName = s.topicName.split(':')[0].trim();
                    }
                    if (subName !== f.subject) return false;
                }
                if (f.topic !== 'todos') {
                    if (s.topicId !== f.topic) return false;
                }
                if (f.startDate) {
                    if (s.date < f.startDate) return false;
                }
                if (f.endDate) {
                    if (s.date > f.endDate) return false;
                }
                if (f.search.trim()) {
                    const term = f.search.trim().toLowerCase();
                    const topName = (s.topicName || '').toLowerCase();
                    const notes = (s.notes || '').toLowerCase();
                    const banca = (s.banca || '').toLowerCase();
                    if (!topName.includes(term) && !notes.includes(term) && !banca.includes(term)) return false;
                }
                return true;
            });

            // Resgata matérias do histórico que já não estão mais no edital ativo
            const histSubjectsList = new Set(allSessions.map(s => {
                const top = getAllTopics().find(t => t.id === s.topicId);
                if (top) return top.subjectName;
                if (s.topicName && s.topicName.includes(':')) return s.topicName.split(':')[0].trim();
                return '';
            }).filter(Boolean));

            const uniqueSubjects = ['todas', ...new Set([...state.syllabus.map(s => s.subject), ...histSubjectsList])];

                ? getAllTopics()
                : getAllTopics().filter(t => t.subjectName === f.subject);

            const hasActiveFilters = (f.subject !== 'todas' || f.topic !== 'todos' || f.startDate || f.endDate || f.search);

                                ${icon('filter')} Filtros de Pesquisa
                            </span>
                            ${hasActiveFilters ? `
                                <button id="btn-clear-hist-filters" class="text-xs font-bold text-rose-500 hover:text-rose-700 transition-colors">
                                    Limpar Filtros
                                </button>
                            ` : ''}
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Disciplina</label>
                                <select id="filter-hist-subject" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
                                    ${uniqueSubjects.map(sub => `<option value="${sub}" ${f.subject === sub ? 'selected' : ''}>${sub === 'todas' ? 'Todas as Disciplinas' : sub}</option>`).join('')}
                                </select>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Tópico</label>
                                <select id="filter-hist-topic" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-semibold focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <option value="todos">Todos os Tópicos</option>
                                    ${activeSubjectTopics.map(t => `<option value="${t.id}" ${f.topic === t.id ? 'selected' : ''}>${t.subjectName}: ${t.name}</option>`).join('')}
                                </select>
                            </div>

                            <div class="grid grid-cols-2 gap-1.5">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">De</label>
                                    <input type="date" id="filter-hist-start" value="${f.startDate}" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-medium"/>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Até</label>
                                    <input type="date" id="filter-hist-end" value="${f.endDate}" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-medium"/>
                                </div>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Busca por Palavra</label>
                                <div class="relative">
                                    <input type="text" id="filter-hist-search" value="${f.search}" placeholder="Ex: Art. 5º, Crase, FGV..." class="w-full p-2.5 pl-8 bg-slate-50 border rounded-xl text-xs font-medium"/>
                                    <span class="absolute left-2.5 top-3 text-slate-400">${icon('search')}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
                            <span>Exibindo <strong>${filtered.length}</strong> de <strong>${allSessions.length}</strong> sessões registradas</span>
                            ${hasActiveFilters ? `<span class="text-indigo-600 font-bold">Filtros Ativos</span>` : ''}
                        </div>
                    </div>

                    <!-- Lista de Sessões -->
                    <div class="space-y-3">
                        ${filtered.length === 0 ? `
                            <div class="bg-white p-12 rounded-3xl border border-slate-200 text-center text-slate-400 italic text-xs space-y-2">
                                <div class="p-3 bg-slate-50 text-slate-400 rounded-2xl w-fit mx-auto mb-2">${icon('history')}</div>

                            </div>
                        ` : filtered.slice().reverse().map(s => `

                                    <div>
                                        <p class="font-extrabold text-sm text-slate-800">${s.topicName}</p>
                                        <p class="text-[11px] text-slate-500">
                                            Banca: <strong class="text-slate-700">${s.banca || 'Cebraspe'}</strong> • Duração: <strong class="text-indigo-600">${formatDuration(s.durationMinutes)}</strong>
                                        </p>
                                    </div>
                                    <div class="flex items-center gap-3 self-end sm:self-auto">
                                        <span class="font-mono text-xs font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">
                                            ${formatDisplayDate(s.date)}
                                        </span>
                                        <div class="flex items-center gap-1">
                                            <button data-edit-session-id="${s.id}" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="Editar Sessão">

                                            <span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[10px] font-bold border border-indigo-100/60">${m}</span>
                                        `).join('')}

                                    <div class="font-mono text-xs font-bold">

                                            <span class="text-slate-700">${s.questions}Q</span>
                                            <span class="text-slate-400">(${Math.round((s.correct / s.questions) * 100)}%)</span>

                                    </div>
                                </div>

                                ${s.notes ? `
                                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs text-slate-600 font-medium">
                                        📝 ${s.notes}
                                    </div>

        function showSimuladoModal(simIdToEdit = null) {
            const container = document.getElementById('modal-container');

            const defaultAc = isEditing ? sim.acertos : 80;
            const defaultEr = isEditing ? sim.erros : 25;
            const defaultBr = isEditing ? sim.emBranco : 15;
            const defaultNotas = isEditing ? (sim.notas || '') : '';

                                <div class="grid grid-cols-2 gap-2">
                                    <label class="p-3 border rounded-xl flex items-center gap-2 cursor-pointer transition-all hover:bg-slate-50">
                                        <input type="radio" name="sim-tipo-radio" value="certo_errado" ${defaultTipo === 'certo_errado' ? 'checked' : ''} class="w-4 h-4 text-purple-600"/>
                                        <div class="text-xs">
                                            <p class="font-bold text-slate-800">⚖️ Certo / Errado</p>
                                            <p class="text-[10px] text-slate-500">1 Erro anula 1 Acerto (Cebraspe/Quadrix)</p>
                                        </div>
                                    </label>
                                    <label class="p-3 border rounded-xl flex items-center gap-2 cursor-pointer transition-all hover:bg-slate-50">
                                        <input type="radio" name="sim-tipo-radio" value="multipla_escolha" ${defaultTipo === 'multipla_escolha' ? 'checked' : ''} class="w-4 h-4 text-purple-600"/>
                                        <div class="text-xs">
                                            <p class="font-bold text-slate-800">🔘 Múltipla Escolha</p>
                                            <p class="text-[10px] text-slate-500">Pontuação Bruta (FGV, FCC, etc.)</p>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div class="grid grid-cols-4 gap-2">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Total Itens</label>
                                    <input id="sim-input-total" type="number" value="${defaultTot}" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold font-mono"/>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-emerald-600 uppercase">Acertos</label>
                                    <input id="sim-input-acertos" type="number" value="${defaultAc}" class="w-full p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-bold font-mono text-emerald-800"/>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-rose-500 uppercase">Erros</label>

                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-amber-600 uppercase">Em Branco</label>

                            <div>

                                <textarea id="sim-input-notas" rows="2" placeholder="O que funcionou, onde houve insegurança, controle do tempo..." class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">${defaultNotas}</textarea>

                            <button id="btn-save-sim-form" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition-all">

                        </div>
                    </div>
                </div>

            document.getElementById('close-sim-modal').onclick = () => { container.innerHTML = ''; };

            document.getElementById('btn-save-sim-form').onclick = () => {
                const titulo = document.getElementById('sim-input-title').value.trim();
                const data = document.getElementById('sim-input-date').value;
                const banca = document.getElementById('sim-input-banca').value;
                const tipo = document.querySelector('input[name="sim-tipo-radio"]:checked').value;
                const total = parseInt(document.getElementById('sim-input-total').value) || 0;
                const ac = parseInt(document.getElementById('sim-input-acertos').value) || 0;
                const er = parseInt(document.getElementById('sim-input-erros').value) || 0;
                const br = parseInt(document.getElementById('sim-input-branco').value) || 0;
                const notas = document.getElementById('sim-input-notas').value.trim();

                if (total <= 0) {
                    showToast("O total de questões deve ser maior que zero.", "info");
                    return;
                }

                if (isEditing) {
                    state.simulados = state.simulados.map(s => {
                        if (s.id !== simIdToEdit) return s;
                        return {
                            ...s,
                            titulo,
                            data,
                            banca,
                            tipoProva: tipo,
                            questoes: total,
                            acertos: ac,
                            erros: er,
                            emBranco: br,
                            notas
                        };
                    });
                    showToast("Simulado atualizado com sucesso!");
                } else {
                    state.simulados.push({
                        id: 'sim-' + Date.now(),
                        prepId: state.activePrepId,
                        titulo,
                        data,
                        banca,
                        tipoProva: tipo,
                        questoes: total,
                        acertos: ac,
                        erros: er,
                        emBranco: br,
                        notas
                    });
                    showToast("Novo simulado registrado!");
                }

                persist();
                container.innerHTML = '';
                render();
            };
        }

        function showEditSessionModal(sessionId) {

                                    <div>
                                        <label class="text-[10px] font-bold text-slate-400 uppercase">Minutos</label>
                                        <input id="edit-sess-mins" type="number" min="0" max="59" value="${mins}" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold"/>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Tópico do Edital</label>
                                <select id="edit-sess-topic" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium">
                                    <option value="">Selecione o Tópico...</option>
                                    ${allTopics.map(t => `<option value="${t.id}" ${sess.topicId === t.id ? 'selected' : ''}>${t.subjectName}: ${t.name}</option>`).join('')}
                                </select>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Banca Examinadora</label>
                                <select id="edit-sess-banca" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium">
                                    ${COMMON_BANCAS.map(b => `<option value="${b}" ${(sess.banca || 'Cebraspe') === b ? 'selected' : ''}>${b}</option>`).join('')}
                                </select>
                            </div>

                            ${renderModalitiesSelector('edit', selectedMods)}

                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Questões Feitas</label>

                            <div>
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Diário / Anotações</label>
                                <textarea id="edit-sess-notes" rows="2" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">${sess.notes || ''}</textarea>
                            </div>

                            <button id="btn-save-edited-sess" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition-all">
                                Salvar Alterações na Sessão
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('close-edit-sess').onclick = () => { container.innerHTML = ''; };

            document.querySelectorAll('[data-toggle-modality="edit"]').forEach(btn => {
                btn.onclick = () => {
                    const m = btn.getAttribute('data-modality');
                    if (selectedMods.includes(m)) {
                        selectedMods = selectedMods.filter(x => x !== m);
                        btn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-slate-100 text-slate-600 hover:bg-slate-200';
                    } else {
                        selectedMods.push(m);
                        btn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-xs';
                    }
                    const counter = document.getElementById('mod-count-indicator-edit');

                    selectedMods = btn.getAttribute('data-combo').split(',');
                    document.querySelectorAll('[data-toggle-modality="edit"]').forEach(b => {
                        const m = b.getAttribute('data-modality');
                        if (selectedMods.includes(m)) {

                    if (counter) counter.textContent = `${selectedMods.length} selecionada(s)`;

            document.getElementById('btn-save-edited-sess').onclick = () => {
                const dt = document.getElementById('edit-sess-date').value;

                const m = parseFloat(document.getElementById('edit-sess-mins').value) || 0;
                const tid = document.getElementById('edit-sess-topic').value;
                const banca = document.getElementById('edit-sess-banca').value;
                const totQ = parseInt(document.getElementById('edit-sess-totalq').value) || 0;
                const corQ = parseInt(document.getElementById('edit-sess-correctq').value) || 0;
                const notes = document.getElementById('edit-sess-notes').value.trim();

                const dur = (h * 60) + m;
                if (dur <= 0) {
                    showToast("Informe a duração do estudo.", "info");
                    return;
                }

                // Ajustar questões no tópico antigo e novo se houver alteração
                const oldTopicId = sess.topicId;
                const oldQ = sess.questions || 0;
                const oldC = sess.correct || 0;

                state.syllabus = state.syllabus.map(s => ({
                    ...s,
                    topics: s.topics.map(t => {
                        if (t.id === oldTopicId) {
                            return {
                                ...t,
                                questions: Math.max(0, (t.questions || 0) - oldQ),
                                correct: Math.max(0, (t.correct || 0) - oldC)
                            };
                        }
                        return t;
                    })
                }));

                if (tid) {
                    state.syllabus = state.syllabus.map(s => ({
                        ...s,
                        topics: s.topics.map(t => {
                            if (t.id === tid) {
                                return {
                                    ...t,
                                    questions: (t.questions || 0) + totQ,
                                    correct: (t.correct || 0) + corQ
                                };
                            }
                            return t;
                        })
                    }));
                }

                const top = allTopics.find(t => t.id === tid);

                state.sessionsHistory = state.sessionsHistory.map(s => {
                    if (s.id !== sessionId) return s;
                    return {
                        ...s,
                        date: dt,
                        durationMinutes: dur,
                        topicId: tid,
                        topicName: top ? `${top.subjectName}: ${top.name}` : (tid ? 'Estudo' : 'Estudo Avulso'),
                        banca: banca || 'Cebraspe',
                        modalities: [...selectedMods],
                        questions: totQ,
                        correct: corQ,
                        notes
                    };
                });

                persist();
                container.innerHTML = '';
                showToast("Sessão atualizada com sucesso!");
                render();
            };
        }

        function render() {
            const allTopics = getAllTopics();
            const currentPrep = getActivePreparation();
            const app = document.getElementById('app');

            // --- Cálculos de Metas Diárias e Semanais ---
            const todayObj = new Date();
            // Ajuste seguro de timezone para evitar inconsistências de fuso
            const todayStr = new Date(todayObj.getTime() - (todayObj.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            
            // Início da semana (Domingo) e Fim (Sábado)
            const currentDay = todayObj.getDay();
            const firstDayOfWeek = new Date(todayObj);
            firstDayOfWeek.setDate(todayObj.getDate() - currentDay);
            const firstDayStr = new Date(firstDayOfWeek.getTime() - (firstDayOfWeek.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            
            const lastDayOfWeek = new Date(firstDayOfWeek);
            lastDayOfWeek.setDate(firstDayOfWeek.getDate() + 6);
            const lastDayStr = new Date(lastDayOfWeek.getTime() - (lastDayOfWeek.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

            // Sessões exclusivas da preparação ativa
            const prepSessions = state.sessionsHistory.filter(s => s.prepId === currentPrep.id);
            
            // Dados de Hoje
            const todaySessions = prepSessions.filter(s => s.date === todayStr);
            const todayMinutes = todaySessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);
            const todayQ = todaySessions.reduce((acc, s) => acc + (s.questions || 0), 0);
            
            // Dados da Semana
            const weekSessions = prepSessions.filter(s => s.date >= firstDayStr && s.date <= lastDayStr);
            const weekMinutes = weekSessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);

            const percHojeQ = Math.min(100, Math.round((todayQ / metaDiariaQ) * 100)) || 0;

            if (state.tab === 'historico') return renderHistoricoTab(currentPrep);

            // DASHBOARD & METAS (100% fiel a questões reais, estritamente isolado de simulados)

                const todayMinutes = todaySessions.reduce((acc, s) => acc + (s.durationMinutes || 0), 0);
                const todayHours = (todayMinutes / 60).toFixed(1);
                const todayQuestions = todaySessions.reduce((acc, s) => acc + (s.questions || 0), 0);
