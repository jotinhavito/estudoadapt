                                            <option value="">Selecione o Tópico...</option>
                                            ${allTopics.map(t => `<option value="${t.id}" ${state.manualTopicId === t.id ? 'selected' : ''}>${t.subjectName}: ${t.name}</option>`).join('')}
                                        </select>
                                    </div>

                                    <div>
                                        <label class="text-[10px] font-bold text-slate-400 uppercase">Banca Examinadora</label>
                                        <select id="input-manual-banca" class="w-full p-3 bg-slate-50 border rounded-xl text-xs font-medium">
                                            ${COMMON_BANCAS.map(b => `<option value="${b}" ${state.manualBanca === b ? 'selected' : ''}>${b}</option>`).join('')}
                                        </select>
                                    </div>

                                    ${renderModalitiesSelector('manual')}

                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="text-[10px] font-bold text-slate-400 uppercase">Questões Feitas</label>
                                            <input id="input-manual-sess-totalq" type="number" value="${state.manualTotalQ}" placeholder="0" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold"/>
                                        </div>
                                        <div>
                                            <label class="text-[10px] font-bold text-slate-400 uppercase">Acertos</label>
                                            <input id="input-manual-sess-correctq" type="number" value="${state.manualCorrectQ}" placeholder="0" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold"/>
                                        </div>
                                    </div>

                                    <div>
                                        <label class="text-[10px] font-bold text-slate-400 uppercase">Diário / Anotações</label>
                                        <textarea id="input-manual-notes" rows="2" placeholder="Resumo do que foi estudado..." class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">${state.manualNotes}</textarea>
                                    </div>

                                    ${renderReviewSchedulerCard('manual')}

                                    <button id="btn-save-manual-session" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md">
                                        Gravar Sessão Manual e Agendar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            return ``;
        }

        function showAiImportSyllabusModal() {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 shadow-2xl space-y-5 border border-slate-100">
                        <div class="flex items-center justify-between pb-3 border-b">
                            <div class="flex items-center gap-2.5">
                                <div class="p-2 bg-purple-50 text-purple-600 rounded-xl">${icon('sparkles')}</div>
                                <div>
                                    <h3 class="text-base font-black text-slate-800">Importar Edital com IA (Gemini 3 Flash)</h3>
                                    <p class="text-xs text-slate-500">Cole o texto bruto do anexo de conteúdo programático</p>
                                </div>
                            </div>
                            <button id="close-ai-import-modal" class="text-slate-400 hover:text-slate-600 p-1">${icon('x')}</button>
                        </div>

                        <div class="space-y-3">
                            <p class="text-xs text-slate-600 leading-relaxed">
                                Cole abaixo o trecho do edital oficial (disciplinas, numerações e tópicos). A IA identificará automaticamente as disciplinas, organizará os tópicos e subtópicos e marcará os itens de <strong>Lei Seca / Legislação</strong>.
                            </p>
                            <textarea id="ai-import-raw-text" rows="8" placeholder="Ex: NOÇÕES DE DIREITO CONSTITUCIONAL: 1 Direitos e deveres fundamentais. 1.1 Direitos individuais e coletivos. 2 Da Administração Pública. 2.1 Disposições gerais..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-mono"></textarea>
                            
                            <div class="flex justify-between items-center pt-2">
                                <span class="text-[11px] text-slate-400">Processamento em 3 a 8 segundos.</span>
                                <div class="flex gap-2">
                                    <button id="cancel-ai-import-btn" class="px-4 py-2 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl">Cancelar</button>
                                    <button id="execute-ai-import-btn" class="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold text-xs rounded-xl shadow-md flex items-center gap-2">
                                        ${icon('sparkles')} Estruturar Edital
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('close-ai-import-modal').onclick = () => { container.innerHTML = ''; };
            document.getElementById('cancel-ai-import-btn').onclick = () => { container.innerHTML = ''; };

            document.getElementById('execute-ai-import-btn').onclick = async () => {
                const rawText = document.getElementById('ai-import-raw-text').value.trim();
                if (!rawText) {
                    showToast("Cole o texto do edital antes de prosseguir.", "info");
                    return;
                }

                container.innerHTML = `
                    <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center space-y-4">
                            <div class="w-12 h-12 mx-auto rounded-full border-4 border-purple-600 border-t-transparent animate-spin-fast"></div>
                            <h4 class="font-bold text-slate-800 text-sm">Estruturando com Gemini 3 Flash...</h4>
                            <p class="text-xs text-slate-500">Separando disciplinas, tópicos e subtópicos com inteligência artificial.</p>
                        </div>
                    </div>
                `;

                try {
                    const prompt = `Analise o texto do edital a seguir e extraia as disciplinas, tópicos e subtópicos no formato JSON estruturado.
Identifique 'isLaw' como true para disciplinas ou tópicos que tratem puramente de Leis, Códigos, Regimentos ou Legislação Seca.

Texto do Edital:
"""
${rawText}
"""`;

                    const jsonSchema = {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "subject": { "type": "STRING" },
                                "topics": {
                                    "type": "ARRAY",
                                    "items": {
                                        "type": "OBJECT",
                                        "properties": {
                                            "name": { "type": "STRING" },
                                            "isLaw": { "type": "BOOLEAN" },
                                            "subtopics": {
                                                "type": "ARRAY",
                                                "items": { "type": "STRING" }
                                            }
                                        },
                                        "required": ["name", "isLaw", "subtopics"]
                                    }
                                }
                            },
                            required: ["subject", "topics"]
                        }
                    };

                    const result = await callGeminiApi({
                        prompt,
                        systemInstruction: "Você é um especialista em estruturação de editais de concursos públicos para o método de estudo verticalizado.",
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: jsonSchema
                        }
                    });

                    const parsed = JSON.parse(result);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        const newSubjects = parsed.map((s, idx) => ({
                            id: 's-ai-' + Date.now() + '-' + idx,
                            subject: s.subject || 'Disciplina',
                            topics: (s.topics || []).map((t, tIdx) => ({
                                id: 't-ai-' + Date.now() + '-' + tIdx,
                                name: t.name || 'Tópico',
                                isLaw: !!t.isLaw,
                                subtopics: t.subtopics || [],
                                progress: 0,
                                questions: 0,
                                correct: 0,
                                status: 'não iniciado',
                                startedAt: null,
                                concludedAt: null
                            }))
                        }));

                        state.syllabus.push(...newSubjects);
                        newSubjects.forEach(ns => state.expandedSubjectIds.push(ns.id));
                        persist();

                        container.innerHTML = '';
                        showToast(`Sucesso! ${newSubjects.length} disciplinas importadas para o Edital Vertical!`);
                        render();
                    } else {
                        throw new Error("Formato não reconhecido pela IA.");
                    }
                } catch(err) {
                    container.innerHTML = '';
                    showToast(`Erro na IA: ${err.message}`, "error");
                }
            };
        }

        function attachEventListeners() {
            // Navegação de abas
            document.querySelectorAll('[data-tab]').forEach(btn => {
                btn.onclick = () => {
                    state.tab = btn.getAttribute('data-tab');
                    state.isMobileMenuOpen = false;
                    render();
                };
            });

            // Menu Mobile
            const btnToggleMenu = document.getElementById('btn-toggle-menu');
            if (btnToggleMenu) {
                btnToggleMenu.onclick = () => {
                    state.isMobileMenuOpen = !state.isMobileMenuOpen;
                    render();
                };
            }
            
            // Tema Light/Dark (Modo Escuro)
            const toggleTheme = () => {
                state.theme = state.theme === 'dark' ? 'light' : 'dark';
                if (state.theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                persist();
                render();
            };
            const btnThemeMobile = document.getElementById('btn-theme-mobile');
            const btnThemeDesktop = document.getElementById('btn-theme-desktop');
            if (btnThemeMobile) btnThemeMobile.onclick = toggleTheme;
            if (btnThemeDesktop) btnThemeDesktop.onclick = toggleTheme;

            // Backup PC ⇄ iPad
            const btnBackupMobile = document.getElementById('btn-backup-mobile');
            const btnBackupDesktop = document.getElementById('btn-backup-desktop');
            if (btnBackupMobile) btnBackupMobile.onclick = showBackupModal;
            if (btnBackupDesktop) btnBackupDesktop.onclick = showBackupModal;

            // Escopo das estatísticas (atual vs global)
            document.querySelectorAll('[data-set-scope]').forEach(btn => {
                btn.onclick = () => {
                    state.statsScope = btn.getAttribute('data-set-scope');
                    render();
                };
            });

            // Filtro de fase (pré vs pós)
            document.querySelectorAll('[data-set-fase-filter]').forEach(btn => {
                btn.onclick = () => {
                    state.faseSubFilter = btn.getAttribute('data-set-fase-filter');
                    render();
                };
            });

            // Gerenciar Preparações
            const btnOpenSwitchPrep = document.getElementById('btn-open-switch-prep-modal');
            const btnSidebarSwitchPrep = document.getElementById('btn-sidebar-switch-prep');
            if (btnOpenSwitchPrep) btnOpenSwitchPrep.onclick = showManagePrepsModal;
            if (btnSidebarSwitchPrep) btnSidebarSwitchPrep.onclick = showManagePrepsModal;

            // Virada para Pós-Edital
            const btnTriggerVirada = document.getElementById('btn-trigger-virada-modal');
            if (btnTriggerVirada) btnTriggerVirada.onclick = () => showViradaModal(getActivePreparation());

            // Ações do Edital Verticalizado
            const btnAddSubjTop = document.getElementById('btn-add-subject-top');
            if (btnAddSubjTop) {
                btnAddSubjTop.onclick = () => {
                    const name = prompt("Nome da Nova Disciplina:");
                    if (name && name.trim()) {
                        const newSub = { id: 's-' + Date.now(), subject: name.trim(), topics: [] };
                        state.syllabus.push(newSub);
                        state.expandedSubjectIds.push(newSub.id);
                        persist();
                        showToast(`Disciplina "${name.trim()}" adicionada!`);
                        render();
                    }
                };
            }

            const btnOpenAiImport = document.getElementById('btn-open-ai-import-modal');
            if (btnOpenAiImport) btnOpenAiImport.onclick = showAiImportSyllabusModal;

            // Expansão de matérias no edital
            document.querySelectorAll('[data-toggle-subject]').forEach(el => {
                el.onclick = () => {
                    const sid = el.getAttribute('data-toggle-subject');
                    if (state.expandedSubjectIds.includes(sid)) {
                        state.expandedSubjectIds = state.expandedSubjectIds.filter(id => id !== sid);
                    } else {
                        state.expandedSubjectIds.push(sid);
                    }
                    persist();
                    render();
                };
            });

            // Checkbox de conclusão de tópicos
            document.querySelectorAll('[data-toggle-topic-done-sid]').forEach(chk => {
                chk.onclick = (e) => {
                    e.stopPropagation();
                    const sid = chk.getAttribute('data-toggle-topic-done-sid');
                    const tid = chk.getAttribute('data-toggle-topic-done-tid');
                    const isChecked = chk.checked;
                    const todayStr = new Date().toISOString().split('T')[0];

                    state.syllabus = state.syllabus.map(s => {
                        if (s.id !== sid) return s;
                        return {
                            ...s,
                            topics: s.topics.map(t => {
                                if (t.id !== tid) return t;
                                return {
                                    ...t,
                                    status: isChecked ? 'concluído' : 'não iniciado',
                                    progress: isChecked ? 100 : 0,
                                    concludedAt: isChecked ? todayStr : null
                                };
                            })
                        };
                    });
                    persist();
                    render();
                };
            });

            // Adicionar subtópico individual
            document.querySelectorAll('[data-add-subtopic-sid]').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const sid = btn.getAttribute('data-add-subtopic-sid');
                    const tid = btn.getAttribute('data-add-subtopic-tid');
                    const text = prompt("Nome do Subtópico:");
                    if (text && text.trim()) {
                        state.syllabus = state.syllabus.map(s => {
                            if (s.id !== sid) return s;
                            return {
                                ...s,
                                topics: s.topics.map(t => {
                                    if (t.id !== tid) return t;
                                    return {
                                        ...t,
                                        subtopics: [...(t.subtopics || []), text.trim()]
                                    };
                                })
                            };
                        });
                        persist();
                        render();
                    }
                };
            });

            // Adicionar tópico a disciplina
            document.querySelectorAll('[data-add-topic]').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const sid = btn.getAttribute('data-add-topic');
                    const text = prompt("Nome do Tópico:");
                    if (text && text.trim()) {
                        state.syllabus = state.syllabus.map(s => {
                            if (s.id !== sid) return s;
                            return {
                                ...s,
                                topics: [...(s.topics || []), {
                                    id: 't-' + Date.now(),
                                    name: text.trim(),
                                    isLaw: false,
                                    progress: 0,
                                    questions: 0,
                                    correct: 0,
                                    status: 'não iniciado',
                                    startedAt: null,
                                    concludedAt: null
                                }]
                            };
                        });
                        persist();
                        render();
                    }
                };
            });
            
            // Excluir Disciplina Completa
            document.querySelectorAll('[data-delete-subject]').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const sid = btn.getAttribute('data-delete-subject');
                    showConfirmModal("Excluir Disciplina", "Atenção: Isso removerá a disciplina do edital. Suas estatísticas passadas (Pré-Edital) continuarão seguras no histórico. Deseja continuar?", () => {
                        const subjectToDelete = state.syllabus.find(s => s.id === sid);
                        if (subjectToDelete) {
                            const topicIds = subjectToDelete.topics.map(t => t.id);
                            // Limpeza Automática: Remove itens do ciclo e revisões agendadas pendentes
                            state.cycles.forEach(c => { c.items = c.items.filter(i => !topicIds.includes(i.topicId)); });
                            state.scheduledReviews = state.scheduledReviews.filter(r => !topicIds.includes(r.topicId));
                        }
                        
                        state.syllabus = state.syllabus.filter(s => s.id !== sid);
                        persist();
                        showToast("Disciplina removida com sucesso!");
                        render();
                    });
                };
            });

            // Deletar Tópico Individual
            document.querySelectorAll('[data-delete-topic-sid]').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const sid = btn.getAttribute('data-delete-topic-sid');
                    const tid = btn.getAttribute('data-delete-topic-tid');
                    showConfirmModal("Excluir Tópico", "Deseja remover permanentemente este tópico do edital? Suas estatísticas passadas serão preservadas.", () => {
                        // Limpeza Automática do Ciclo e Revisões
                        state.cycles.forEach(c => { c.items = c.items.filter(i => i.topicId !== tid); });
                        state.scheduledReviews = state.scheduledReviews.filter(r => r.topicId !== tid);

                        state.syllabus = state.syllabus.map(s => {
                            if (s.id !== sid) return s;
                            return {
                                ...s,
                                topics: s.topics.filter(t => t.id !== tid)
                            };
                        });
                        persist();
                        showToast("Tópico excluído.");
                        render();
                    });
                };
            });

            // --- Eventos da Aba Ciclos ---
            
            document.querySelectorAll('[data-select-cycle]').forEach(btn => {
                btn.onclick = () => {
                    state.activeCycleIdx = parseInt(btn.getAttribute('data-select-cycle'));
                    render();
                };
            });
            
            const btnMarkAllCycle = document.getElementById('btn-mark-all-cycle');
            if (btnMarkAllCycle) {
                btnMarkAllCycle.onclick = () => {
                    state.cycles[state.activeCycleIdx].items.forEach(i => i.done = true);
                    persist();
                    render();
                };
            }

            const btnUnmarkAllCycle = document.getElementById('btn-unmark-all-cycle');
            if (btnUnmarkAllCycle) {
                btnUnmarkAllCycle.onclick = () => {
                    state.cycles[state.activeCycleIdx].items.forEach(i => i.done = false);
                    persist();
                    render();
                };
            }

            const btnResetCycle = document.getElementById('btn-reset-cycle');
            if (btnResetCycle) {
                btnResetCycle.onclick = () => {
                    showConfirmModal("Reiniciar Rodada do Ciclo", "Isso vai desmarcar todos os itens para que você comece uma nova rodada. Continuar?", () => {
                        state.cycles[state.activeCycleIdx].items.forEach(i => i.done = false);
                        persist();
                        showToast("Ciclo reiniciado com sucesso!");
                        render();
                    });
                };
            }

            document.querySelectorAll('[data-toggle-cycle-done]').forEach(chk => {
                chk.onchange = () => {
                    const itemId = chk.getAttribute('data-toggle-cycle-done');
                    const item = state.cycles[state.activeCycleIdx].items.find(i => i.id === itemId);
                    if (item) {
                        item.done = chk.checked;
                        persist();
                        render();
                    }
                };
            });

            document.querySelectorAll('[data-delete-cycle-item]').forEach(btn => {
                btn.onclick = () => {
                    const itemId = btn.getAttribute('data-delete-cycle-item');
                    state.cycles[state.activeCycleIdx].items = state.cycles[state.activeCycleIdx].items.filter(i => i.id !== itemId);
                    persist();
                    render();
                };
            });

            const btnBatchAddCycle = document.getElementById('btn-batch-add-cycle');
            const selectAddCycle = document.getElementById('select-add-to-cycle');
            if (btnBatchAddCycle && selectAddCycle) {
                btnBatchAddCycle.onclick = () => {
                    const tid = selectAddCycle.value;
                    if (!tid) {
                        showToast("Selecione um tópico para adicionar ao ciclo.", "info");
                        return;
                    }
                    const tInfo = getAllTopics().find(t => t.id === tid);
                    if (tInfo) {
                        state.cycles[state.activeCycleIdx].items.push({
                            id: 'ci-' + Date.now(),
                            topicId: tid,
                            name: `${tInfo.subjectName}: ${tInfo.name}`,
                            done: false
                        });
                        persist();
                        showToast(`"${tInfo.name}" adicionado ao ciclo!`);
                        render();
                    }
                };
            }

            // --- Eventos da Aba Sessão de Foco / Registro ---

            const toggleTimer = () => {
                if (state.isTimerRunning) {
                    clearInterval(state.timerInterval);
                    state.isTimerRunning = false;
                } else {
                    state.isTimerRunning = true;
                    state.timerInterval = setInterval(() => {
                        state.timer++;
                        const timeStrs = document.querySelectorAll('.font-mono');
                        const timeStr = formatTimer(state.timer);
                        timeStrs.forEach(el => {
                            if (el.textContent.includes(':')) el.textContent = timeStr;
                        });
                    }, 1000);
                }
                render();
            };

            const btnToggleTimer = document.getElementById('btn-toggle-timer');
            if (btnToggleTimer) btnToggleTimer.onclick = toggleTimer;

            const btnResetTimer = document.getElementById('btn-reset-timer');
            if (btnResetTimer) {
                btnResetTimer.onclick = () => {
                    showConfirmModal("Zerar Cronômetro", "Tem certeza que deseja descartar o tempo atual?", () => {
                        clearInterval(state.timerInterval);
                        state.timer = 0;
                        state.isTimerRunning = false;
                        render();
                        showToast("Cronômetro zerado.");
                    });
                };
            }

            // Modalidades
            document.querySelectorAll('[data-toggle-modality]').forEach(btn => {
                btn.onclick = () => {
                    const target = btn.getAttribute('data-toggle-modality');
                    const mod = btn.getAttribute('data-modality');
                    const list = target === 'timer' ? state.timerModalities : state.manualModalities;
                    
                    if (list.includes(mod)) {
                        list.splice(list.indexOf(mod), 1);
                    } else {
                        list.push(mod);
                    }
                    render();
                };
            });

            document.querySelectorAll('[data-apply-combo]').forEach(btn => {
                btn.onclick = () => {
                    const target = btn.getAttribute('data-apply-combo');
                    const mods = btn.getAttribute('data-combo').split(',');
                    if (target === 'timer') state.timerModalities = mods;
                    else state.manualModalities = mods;
                    render();
                };
            });

            const timerInputs = ['timerQuestions', 'timerCorrect', 'timerNotes', 'timerTopicId', 'timerBanca'];
            timerInputs.forEach(key => {
                const elId = key === 'timerTopicId' ? 'timer-topic-select' :
                             key === 'timerBanca' ? 'timer-banca-select' :
                             key === 'timerQuestions' ? 'input-timer-totalq' :
                             key === 'timerCorrect' ? 'input-timer-correctq' : 'input-timer-notes';
                const el = document.getElementById(elId);
                if (el) {
                    el.onchange = (e) => { state[key] = e.target.value; };
                }
            });

            const manualInputs = ['manualDate', 'manualHours', 'manualMinutes', 'manualTopicId', 'manualBanca', 'manualTotalQ', 'manualCorrectQ', 'manualNotes'];
            manualInputs.forEach(key => {
                const elId = key === 'manualDate' ? 'input-manual-date' :
                             key === 'manualHours' ? 'input-manual-hours' :
                             key === 'manualMinutes' ? 'input-manual-minutes' :
                             key === 'manualTopicId' ? 'input-manual-sess-topic' :
                             key === 'manualBanca' ? 'input-manual-banca' :
                             key === 'manualTotalQ' ? 'input-manual-sess-totalq' :
                             key === 'manualCorrectQ' ? 'input-manual-sess-correctq' : 'input-manual-notes';
                const el = document.getElementById(elId);
                if (el) {
                    el.onchange = (e) => { state[key] = e.target.value; };
                }
            });

            // Agendador de Revisões nos Formulários
            ['timer', 'manual'].forEach(target => {
                const chkEnable = document.getElementById(`chk-enable-review-${target}`);
                if (chkEnable) {
                    chkEnable.onchange = (e) => {
                        state.reviewConfigs[target].enabled = e.target.checked;
                        render();
                    };
                }

                document.querySelectorAll(`[data-rev-mode-btn="${target}"]`).forEach(btn => {
                    btn.onclick = () => {
                        state.reviewConfigs[target].mode = btn.getAttribute('data-mode');
                        render();
                    };
                });

                document.querySelectorAll(`[data-rev-preset-btn="${target}"]`).forEach(btn => {
                    btn.onclick = () => {
                        state.reviewConfigs[target].spacedPreset = btn.getAttribute('data-preset');
                        render();
                    };
                });

                const chkRepeat = document.getElementById(`chk-spaced-repeat-${target}`);
                if (chkRepeat) {
                    chkRepeat.onchange = (e) => {
                        state.reviewConfigs[target].spacedRepeatAfterLast = e.target.checked;
                        render();
                    };
                }

                document.querySelectorAll(`[data-remove-custom-date="${target}"]`).forEach(btn => {
                    btn.onclick = () => {
                        const idx = parseInt(btn.getAttribute('data-index'));
                        state.reviewConfigs[target].customDates.splice(idx, 1);
                        render();
                    };
                });

                const btnAddDate = document.getElementById(`btn-add-custom-date-${target}`);
                if (btnAddDate) {
                    btnAddDate.onclick = () => {
                        state.reviewConfigs[target].customDates.push('');
                        render();
                    };
                }

                document.querySelectorAll(`[data-rev-custom-date="${target}"]`).forEach(inp => {
                    inp.onchange = (e) => {
                        const idx = parseInt(inp.getAttribute('data-index'));
                        state.reviewConfigs[target].customDates[idx] = e.target.value;
                        render();
                    };
                });

                document.querySelectorAll(`[data-rev-freq-btn="${target}"]`).forEach(btn => {
                    btn.onclick = () => {
                        state.reviewConfigs[target].recurringFreq = btn.getAttribute('data-freq');
                        render();
                    };
                });

                const inpEvery = document.getElementById(`input-rec-every-${target}`);
                if (inpEvery) {
                    inpEvery.onchange = (e) => {
                        state.reviewConfigs[target].recurringEvery = parseInt(e.target.value) || 1;
                        render();
                    };
                }

                const inpStart = document.getElementById(`input-rec-start-${target}`);
                if (inpStart) {
                    inpStart.onchange = (e) => {
                        state.reviewConfigs[target].recurringStartDate = e.target.value;
                        render();
                    };
                }

                const chkIndef = document.getElementById(`chk-rec-indef-${target}`);
                if (chkIndef) {
                    chkIndef.onchange = (e) => {
                        state.reviewConfigs[target].recurringIndefinite = e.target.checked;
                        render();
                    };
                }
            });

            // Salvar Sessão Final
            const saveSession = (isTimer) => {
                const target = isTimer ? 'timer' : 'manual';
                const topicId = document.getElementById(isTimer ? 'timer-topic-select' : 'input-manual-sess-topic').value;
                const banca = document.getElementById(isTimer ? 'timer-banca-select' : 'input-manual-banca').value;
                const questions = parseInt(document.getElementById(isTimer ? 'input-timer-totalq' : 'input-manual-sess-totalq').value) || 0;
                const correct = parseInt(document.getElementById(isTimer ? 'input-timer-correctq' : 'input-manual-sess-correctq').value) || 0;
                const notes = document.getElementById(isTimer ? 'input-timer-notes' : 'input-manual-notes').value;
                const modalities = isTimer ? state.timerModalities : state.manualModalities;
                
                let dur = state.timer / 60;
                let date = new Date().toISOString().split('T')[0];
                
                if (!isTimer) {
                    date = document.getElementById('input-manual-date').value;
                    const h = parseInt(document.getElementById('input-manual-hours').value) || 0;
                    const m = parseInt(document.getElementById('input-manual-minutes').value) || 0;
                    dur = (h * 60) + m;
                }
                
                if (dur <= 0) {
                    showToast("A duração deve ser maior que zero.", "error");
                    return;
                }

                const tInfo = getAllTopics().find(t => t.id === topicId);
                
                state.sessionsHistory.push({
                    id: 'sess-' + Date.now(),
                    prepId: state.activePrepId,
                    banca,
                    date,
                    topicId,
                    topicName: tInfo ? `${tInfo.subjectName}: ${tInfo.name}` : 'Estudo Avulso',
                    durationMinutes: dur,
                    modalities: [...modalities],
                    questions,
                    correct,
                    notes
                });

                if (topicId) {
                    state.syllabus = state.syllabus.map(s => ({
                        ...s,
                        topics: s.topics.map(t => {
                            if (t.id === topicId) {
                                return {
                                    ...t,
                                    questions: (t.questions || 0) + questions,
                                    correct: (t.correct || 0) + correct,
                                    status: 'em andamento'
                                };
                            }
                            return t;
                        })
                    }));
                }
                
                const revCfg = state.reviewConfigs[target];
                if (revCfg.enabled && topicId) {
                    const revDates = calculateReviewDates(revCfg, date);
                    if (revDates.length > 0) {
                        state.scheduledReviews.push({
                            id: 'rev-' + Date.now(),
                            prepId: state.activePrepId,
                            topicId,
                            topicName: tInfo ? `${tInfo.subjectName}: ${tInfo.name}` : 'Revisão',
                            mode: revCfg.mode,
                            ruleDescription: revCfg.mode === 'espacada' ? `Espaçada: ${revCfg.spacedPreset}` : (revCfg.mode === 'datas' ? 'Datas escolhidas' : `Recorrente: ${revCfg.recurringFreq}`),
                            dates: revDates,
                            completedDates: []
                        });
                    }
                }

                if (isTimer) {
                    state.timer = 0;
                    state.isTimerRunning = false;
                    clearInterval(state.timerInterval);
                    state.timerNotes = '';
                    state.timerQuestions = '';
                    state.timerCorrect = '';
                } else {
                    state.manualNotes = '';
                    state.manualTotalQ = '';
                    state.manualCorrectQ = '';
                }

                persist();
                showToast("Sessão salva com sucesso!");
                render();
            };

            const btnFinishTimer = document.getElementById('btn-finish-timer-session');
            if (btnFinishTimer) btnFinishTimer.onclick = () => saveSession(true);

            const btnSaveManual = document.getElementById('btn-save-manual-session');
            if (btnSaveManual) btnSaveManual.onclick = () => saveSession(false);
            
            // --- Eventos de Stats / Calendário ---
            const btnCalPrev = document.getElementById('btn-cal-prev');
            if (btnCalPrev) btnCalPrev.onclick = () => {
                state.calendarMonth--;
                if (state.calendarMonth < 0) {
                    state.calendarMonth = 11;
                    state.calendarYear--;
                }
                render();
            };
            
            const btnCalNext = document.getElementById('btn-cal-next');
            if (btnCalNext) btnCalNext.onclick = () => {
                state.calendarMonth++;
                if (state.calendarMonth > 11) {
                    state.calendarMonth = 0;
                    state.calendarYear++;
                }
                render();
            };

            document.querySelectorAll('[data-cal-day]').forEach(div => {
                div.onclick = () => {
                    state.calendarSelectedDay = div.getAttribute('data-cal-day');
                    render();
                };
            });
            
            document.querySelectorAll('[data-toggle-rev-done-id]').forEach(btn => {
                btn.onclick = () => {
                    const revId = btn.getAttribute('data-toggle-rev-done-id');
                    const dt = btn.getAttribute('data-date');
                    const rev = state.scheduledReviews.find(r => r.id === revId);
                    if (rev) {
                        if (rev.completedDates.includes(dt)) {
                            rev.completedDates = rev.completedDates.filter(d => d !== dt);
                        } else {
                            rev.completedDates.push(dt);
                        }
                        persist();
                        render();
                    }
                };
            });
            
            const statBancaSelect = document.getElementById('filter-stats-banca');
            if (statBancaSelect) {
                statBancaSelect.onchange = (e) => {
                    state.statsBancaFilter = e.target.value;
                    render();
                }
            }
            const statSubSelect = document.getElementById('filter-stats-subject');
            if (statSubSelect) {
                statSubSelect.onchange = (e) => {
                    state.statsSubjectFilter = e.target.value;
                    render();
                }
            }
            const statOrdSelect = document.getElementById('order-stats-banca');
            if (statOrdSelect) {
                statOrdSelect.onchange = (e) => {
                    state.statsOrder = e.target.value;
                    render();
                }
            }
            
            document.querySelectorAll('[data-toggle-banca]').forEach(div => {
                div.onclick = () => {
                    const b = div.getAttribute('data-toggle-banca');
                    if (state.expandedBancaNames.includes(b)) {
                        state.expandedBancaNames = state.expandedBancaNames.filter(name => name !== b);
                    } else {
                        state.expandedBancaNames.push(b);
                    }
                    render();
                }
            });
            
            document.querySelectorAll('[data-toggle-compare-prep]').forEach(div => {
                div.onclick = () => {
                    const pId = div.getAttribute('data-toggle-compare-prep');
                    if (state.expandedComparePrepIds.includes(pId)) {
                        state.expandedComparePrepIds = state.expandedComparePrepIds.filter(id => id !== pId);
                    } else {
                        state.expandedComparePrepIds.push(pId);
                    }
                    render();
                }
            });
            
            const btnAiImport = document.getElementById('btn-open-ai-import-modal');
            if (btnAiImport) {
                btnAiImport.onclick = showAiImportSyllabusModal;
            }

            // --- Eventos de Simulados (Em Branco e Tipo de Prova) ---
            const btnNewSim = document.getElementById('btn-open-new-sim-modal');
            if (btnNewSim) btnNewSim.onclick = () => showSimuladoModal();

            document.querySelectorAll('[data-edit-sim-id]').forEach(btn => {
                btn.onclick = () => showSimuladoModal(btn.getAttribute('data-edit-sim-id'));
            });

            document.querySelectorAll('[data-delete-sim-id]').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute('data-delete-sim-id');
                    showConfirmModal("Excluir Simulado", "Deseja remover este simulado do histórico?", () => {
                        state.simulados = state.simulados.filter(s => s.id !== id);
                        persist();
                        showToast("Simulado removido.");
                        render();
                    });
                };
            });

            // --- Eventos de Histórico / Diário (Filtros e Edição) ---
            const btnClearHist = document.getElementById('btn-clear-hist-filters');
            if (btnClearHist) {
                btnClearHist.onclick = () => {
                    state.historyFilters = { subject: 'todas', topic: 'todos', startDate: '', endDate: '', search: '' };
                    render();
                };
            }

            const filterHistIds = ['filter-hist-subject', 'filter-hist-topic', 'filter-hist-start', 'filter-hist-end', 'filter-hist-search'];
            filterHistIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.onchange = (e) => {
                        const key = id.replace('filter-hist-', '');
                        if (key === 'start') state.historyFilters.startDate = e.target.value;
                        else if (key === 'end') state.historyFilters.endDate = e.target.value;
                        else state.historyFilters[key] = e.target.value;
                        render();
                    };
                    if (id === 'filter-hist-search') {
                        el.oninput = (e) => {
                            state.historyFilters.search = e.target.value;
                            render();
                        };
                    }
                }
            });

            document.querySelectorAll('[data-edit-session-id]').forEach(btn => {
                btn.onclick = () => showEditSessionModal(btn.getAttribute('data-edit-session-id'));
            });

            document.querySelectorAll('[data-delete-session-id]').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute('data-delete-session-id');
                    showConfirmModal("Excluir Sessão", "Deseja remover esta sessão do diário? As questões resolvidas nela serão subtraídas do edital.", () => {
                        const sess = state.sessionsHistory.find(s => s.id === id);
                        if (sess && sess.topicId) {
                            state.syllabus = state.syllabus.map(s => ({
                                ...s,
                                topics: s.topics.map(t => {
                                    if (t.id === sess.topicId) {
                                        return {
                                            ...t,
                                            questions: Math.max(0, (t.questions || 0) - (sess.questions || 0)),
                                            correct: Math.max(0, (t.correct || 0) - (sess.correct || 0))
                                        };
                                    }
                                    return t;
                                })
                            }));
                        }
                        state.sessionsHistory = state.sessionsHistory.filter(s => s.id !== id);
                        persist();
                        showToast("Sessão removida do histórico.");
                        render();
                    });
                };
            });

        } // Finaliza attachEventListeners

        render(); // Chamada inicial de boot da aplicação
    </script>
</body>
</html>
